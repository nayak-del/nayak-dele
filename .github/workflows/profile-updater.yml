name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-profile-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Generate Snake Animation
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f0f6fc&color_dots=#161b22,#21262d,#30363d,#6e7681,#8b949e

      # 2. Generate 3D Contribution Calendar Graph
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. Generate Profile Summary Cards
      - name: Generate Profile Summary Cards
        uses: vn-ki/github-profile-summary-cards@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.ref_name }}
          UTC_OFFSET: 5.5
          THEME: github_dark_dimmed

      # 4. Commit and Push Assets
      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/ profile-3d-contrib/ profile-summary-card-output/ github-contribution-grid-snake-dark.svg || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(stats): update profile metrics and charts [skip ci]" && git push)
