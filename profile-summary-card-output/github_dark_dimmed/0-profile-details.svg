<svg width="860" height="200" viewBox="0 0 860 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B17457" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1c1b1a" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="860" height="200" rx="6" fill="#1c1b1a" stroke="#4A4947" stroke-width="1"/>
  
  <g transform="translate(30, 36)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FAF7F0">nayak-del (Om)</text>
    
    <g transform="translate(0, 30)">
      <circle cx="8" cy="8" r="7" fill="#B17457"/>
      <text x="24" y="12" font-family="'Segoe UI', sans-serif" font-size="13" fill="#FAF7F0">69 Contributions on GitHub</text>
    </g>

    <g transform="translate(0, 60)">
      <rect x="2" y="2" width="12" height="12" rx="2" fill="#D8D2C2"/>
      <text x="24" y="12" font-family="'Segoe UI', sans-serif" font-size="13" fill="#D8D2C2">7 Public Repositories</text>
    </g>

    <g transform="translate(0, 90)">
