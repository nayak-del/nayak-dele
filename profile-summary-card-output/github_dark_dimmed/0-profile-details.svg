<svg width="860" height="200" viewBox="0 0 860 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBE2CC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#191816" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="860" height="200" rx="6" fill="#191816" stroke="#B7B09E" stroke-width="1"/>
  
  <!-- Left Side: Profile Information in #EBE2CC #DED6C1 #CFC6B1 -->
  <g transform="translate(30, 36)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#EBE2CC">nayak-del (Om)</text>
    
    <g transform="translate(0, 30)">
      <circle cx="8" cy="8" r="7" fill="#DED6C1"/>
      <text x="24" y="12" font-family="'Segoe UI', sans-serif" font-size="13" fill="#EBE2CC">66+ Contributions on GitHub</text>
    </g>

    <g transform="translate(0, 60)">
      <rect x="2" y="2" width="12" height="12" rx="2" fill="#CFC6B1"/>
      <text x="24" y="12" font-family="'Segoe UI', sans-serif" font-size="13" fill="#DED6C1">7 Public Repositories</text>
    </g>

    <g transform="translate(0, 90)">
      <circle cx="8" cy="8" r="7" fill="none" stroke="#CFC6B1" stroke-width="2"/>
      <text x="24" y="12" font-family="'Segoe UI', sans-serif" font-size="13" fill="#DED6C1">Active on GitHub &bull; Odisha, India</text>
    </g>

    <g transform="translate(0, 120)">
      <text x="24" y="12" font-family="'Segoe UI', sans-serif" font-size="12" font-style="italic" fill="#CFC6B1">"In God we trust, all others must bring data."</text>
    </g>
  </g>

  <!-- Right Side: Contributions Trend Area Graph -->
  <g transform="translate(420, 25)">
    <text x="400" y="15" font-family="'Segoe UI', sans-serif" font-size="11" fill="#CFC6B1" text-anchor="end">contributions in the last year</text>

    <!-- Axes -->
    <path d="M 0 130 L 400 130" stroke="#B7B09E" stroke-width="1"/>
    
    <!-- Smooth Area Path in #EBE2CC -->
    <path d="M 0 130 Q 50 110 90 60 T 170 85 T 260 40 T 340 70 T 400 35 L 400 130 Z" fill="url(#areaGrad)"/>
    <path d="M 0 130 Q 50 110 90 60 T 170 85 T 260 40 T 340 70 T 400 35" fill="none" stroke="#EBE2CC" stroke-width="2.5"/>

    <!-- Month markers -->
    <text x="20" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#CFC6B1">Apr</text>
    <text x="100" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#CFC6B1">Jun</text>
    <text x="180" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#CFC6B1">Aug</text>
    <text x="260" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#CFC6B1">Oct</text>
    <text x="340" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#CFC6B1">Dec</text>
  </g>
</svg>