      <text x="24" y="12" font-family="'Segoe UI', sans-serif" font-size="13" fill="#D8D2C2">Active on GitHub &bull; Odisha, India</text>
    </g>

    <g transform="translate(0, 120)">
      <text x="24" y="12" font-family="'Segoe UI', sans-serif" font-size="12" font-style="italic" fill="#D8D2C2">"In God we trust, all others must bring data."</text>
    </g>
