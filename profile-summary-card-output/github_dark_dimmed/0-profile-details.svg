  <g transform="translate(420, 25)">
    <text x="400" y="15" font-family="'Segoe UI', sans-serif" font-size="11" fill="#D8D2C2" text-anchor="end">contributions in the last year</text>

    <path d="M 0 130 L 400 130" stroke="#4A4947" stroke-width="1"/>
    
    <path d="M 0 130 Q 50 110 90 60 T 170 85 T 260 40 T 340 70 T 400 35 L 400 130 Z" fill="url(#areaGrad)"/>
    <path d="M 0 130 Q 50 110 90 60 T 170 85 T 260 40 T 340 70 T 400 35" fill="none" stroke="#B17457" stroke-width="2.5"/>

    <text x="20" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#D8D2C2">Apr</text>
    <text x="100" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#D8D2C2">Jun</text>
    <text x="180" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#D8D2C2">Aug</text>
    <text x="260" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#D8D2C2">Oct</text>
    <text x="340" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#D8D2C2">Dec</text>
